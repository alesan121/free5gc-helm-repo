upfInterface: ens3
upfSbiInterface: cni0
global:
  kubernetesDistribution: Vanilla
  coreNetworkConfigMap: oai-5g-core
  clusterIpServiceIpAllocation: true
  waitForNRF: true
  waitForUDR: true
  http2Param: "--http2-prior-knowledge"
  timeout: 1
mysql:
  enabled: true
  imagePullPolicy: IfNotPresent
  oai5gdatabase: basic
  persistence:
    enabled: true
    storageClass: "local-path"
oai-nrf:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-nrf
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    nrf: true
    tcpdump: false
oai-lmf:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-lmf
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    lmf: true
    tcpdump: false
oai-udr:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-udr
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    udr: true
    tcpdump: false
oai-udm:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-udm
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    udm: true
    tcpdump: false
oai-ausf:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-ausf
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    ausf: true
    tcpdump: false
oai-amf:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-amf
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    amf: true
    tcpdump: false
  multus:
    enabled: false
  service:
    type: NodePort
  exposedPorts:
    nodePorts:
      sctp: 30412
oai-upf:
  enabled: true
  hostNetwork: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-upf
    version: v2.2.1
    pullPolicy: IfNotPresent
  start:
    upf: true
    tcpdump: false
  multus:
    enabled: false
oai-traffic-server:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/trf-gen-cn5g
    version: latest # v2.2.1 does not exist in the repository, using latest for now
    pullPolicy: IfNotPresent
  multus:
    enabled: false
  config:
    ueroute: 12.1.1.0/24
    upfHost: oai-upf
    noOfIperf3Server: 2
  resources:
    define: false
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
oai-smf:
  enabled: true
  nfimage:
    repository: docker.io/oaisoftwarealliance/oai-smf
    version: v2.2.1
    pullPolicy: IfNotPresent
  config:
    imsHost: ims
  start:
    smf: true
    tcpdump: false
  multus:
    enabled: false
ims:
  enabled: true
  imsUsers:
    - id: "001010000000100"
      fullname: tom
      hassip: yes
      context: users
      host: dynamic
      transport: tcp,udp
    - id: "001010000000101"
      fullname: harry
      hassip: yes
      context: users
      host: dynamic
      transport: tcp,udp
